<style>
:root {
  color-scheme: light dark;
  --paper: #f1ede4;
  --surface: #f8f6f1;
  --ink: #1b2230;
  --text-secondary: #404656;
  --accent: #2747b8;
  --cloth: #2747b8;
  --on-cloth: #f1ede4;
  --rule: rgb(27 34 48 / 0.35);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #181613;
    --surface: #211f1b;
    --ink: #ece6da;
    --text-secondary: #bdb6a9;
    --accent: #8fa8ff;
    --cloth: #3a5bb8;
    --on-cloth: #ece6da;
    --rule: rgb(236 230 218 / 0.35);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: var(--paper);
  color: var(--ink);
  font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
main {
  width: 100%;
  max-width: 440px;
  padding: 32px;
  background: var(--surface);
  border: 1.5px solid var(--rule);
  border-radius: 4px;
}
img {
  display: block;
  width: 96px;
  height: 96px;
  border-radius: 22.5%;
}
h1 {
  margin: 24px 0 8px;
  font: 600 40px/1.1 ui-serif, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  letter-spacing: -0.01em;
}
p { margin: 0; color: var(--text-secondary); }
.open {
  display: block;
  margin-top: 24px;
  padding: 12px 16px;
  background: var(--cloth);
  color: var(--on-cloth);
  border-radius: 4px;
  font-weight: 600;
  text-align: center;
  text-decoration: none;
}
ul {
  margin: 20px 0 0;
  padding: 16px 0 0;
  border-top: 1.5px solid var(--rule);
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 20px;
  font-size: 15px;
}
ul a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/owl.png" width="96" height="96" alt="">
  <h1>OwlLuna</h1>
  <p>Handwritten notes for iPad. Free and open source, with no subscriptions, no ads, no accounts and no tracking.</p>
  <a class="open" href="/OwlLuna/">Go to OwlLuna</a>

    <li><a href="https://github.com/owaisazmal">By Owais Khan</a></li>
  </ul>
</main>
</body>
